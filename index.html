            color: #ffeaa7;
            font-size: 38px;
            font-family: 'Fredoka One', cursive, sans-serif;
            padding: 18px 60px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0px 8px 0px #00896b;
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 2px;

        .play-btn:hover {

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playOkayMelody() {
            initAudio();
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.12);
                
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.12 + 0.3);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(audioCtx.currentTime + index * 0.12);
                osc.stop(audioCtx.currentTime + index * 0.12 + 0.3);
            });
        }

        function playOopsMelody() {
            initAudio();
            const notes = [300, 240, 180];
            notes.forEach((freq, index) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.18);
                
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime + index * 0.18);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.18 + 0.4);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(audioCtx.currentTime + index * 0.18);
                osc.stop(audioCtx.currentTime + index * 0.18 + 0.4);
            });

        function selectTopic(topicName) {
            gameSettings.topic = topicName;
            document.getElementById('topicsMenu').style.display = 'none';
            document.getElementById('logoSection').style.display = 'flex';
            document.getElementById('gameConfigMenu').style.display = 'flex';
        }

        function selectOption(type, value, btnElement) {
            const parent = btnElement.parentElement;
            parent.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            btnElement.classList.add('selected');
            gameSettings[type] = value;
        }

        function startGame() {
            initAudio();
            document.getElementById('gameConfigMenu').style.display = 'none';
            document.getElementById('logoSection').style.display = 'none';
            document.getElementById('gameBoardMenu').style.display = 'flex';
            document.getElementById('winnerModal').style.display = 'none';
            
            currentTeam = 1;
            teamScores = {};
            for (let i = 1; i <= gameSettings.teams; i++) {
                teamScores[i] = 0;
            }

            let count = parseInt(gameSettings.grid);
            totalCellsCount = count;
            openedCellsCount = 0;

            renderScoreboard();

            const board = document.getElementById('gridBoard');
            board.innerHTML = '';
            
            if (count === 8) {
                board.style.gridTemplateColumns = `repeat(4, 1fr)`;
            } else if (count === 16) {
                board.style.gridTemplateColumns = `repeat(4, 1fr)`;
            } else if (count === 24) {
                board.style.gridTemplateColumns = `repeat(6, 1fr)`;
            } else {
                board.style.gridTemplateColumns = `repeat(8, 1fr)`;
            }

            for (let i = 1; i <= count; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.innerText = i;
                cell.onclick = function() {
                    if (!cell.classList.contains('opened')) {
                        activeCell = cell;
                        openQuestionModal(i);
                    }
                };
                board.appendChild(cell);
            }
        }

        function openQuestionModal(cellNumber) {
            document.getElementById('gameBoardMenu').style.display = 'none';
            document.getElementById('questionModal').style.display = 'flex';

            document.getElementById('modalQuestionNumber').innerText = `Team ${currentTeam} - Question ${cellNumber}`;
            
            const topicDict = topicQuestions[gameSettings.topic] || topicQuestions['Present Simple'];
            currentQuestionData = topicDict[cellNumber] || { q: "Sample Question", a: "Sample Answer", type: "normal" };

            document.getElementById('modalQuestionText').innerText = currentQuestionData.q;
            document.getElementById('modalAnswerText').innerText = currentQuestionData.a;
            
            document.getElementById('modalAnswerText').style.display = 'none';
            document.getElementById('checkBtn').style.display = 'inline-block';
            document.getElementById('oopsBtn').style.display = 'none';
            document.getElementById('okayBtn').style.display = 'none';
        }

        function checkAnswer() {
            document.getElementById('modalAnswerText').style.display = 'block';
            document.getElementById('checkBtn').style.display = 'none';

            if (currentQuestionData.type === 'bonus') {
                document.getElementById('oopsBtn').style.display = 'none';
                document.getElementById('okayBtn').style.display = 'inline-block';
            } else {
                document.getElementById('oopsBtn').style.display = 'inline-block';
                document.getElementById('okayBtn').style.display = 'inline-block';
            }
        }

        function answerResult(isCorrect) {
            activeCell.classList.add('opened');
            openedCellsCount++;

            if (isCorrect) {
                playOkayMelody();
            } else {
                playOopsMelody();
            }

            if (currentQuestionData.type === 'bonus') {
                if (isCorrect) {
                    teamScores[currentTeam] += currentQuestionData.val;
                }
            } else if (currentQuestionData.type === 'neutral') {
                // Hech narsa o'zgarmaydi
            } else {
                if (isCorrect) {
                    teamScores[currentTeam] += 10;
                } else {
                    teamScores[currentTeam] -= 10;
                }
            }

            currentTeam++;
            if (currentTeam > gameSettings.teams) {
                currentTeam = 1;
            }

            renderScoreboard();

            document.getElementById('questionModal').style.display = 'none';

            if (openedCellsCount >= totalCellsCount) {
                showWinnerModal();
            } else {
                document.getElementById('gameBoardMenu').style.display = 'flex';
            }
        }

        function showWinnerModal() {
            document.getElementById('gameBoardMenu').style.display = 'none';
            document.getElementById('winnerModal').style.display = 'flex';

            let bestTeam = 1;
            let maxScore = teamScores[1];
            for (let i = 2; i <= gameSettings.teams; i++) {
                if (teamScores[i] > maxScore) {
                    maxScore = teamScores[i];
                    bestTeam = i;
                }
            }

            document.getElementById('winnerTitle').innerText = "🎉 YOU WIN! 🎉";
            document.getElementById('winnerText').innerText = `Team ${bestTeam} yutdi! (${maxScore} ball)`;

            triggerConfetti();
        }

        function triggerConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 7,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 7,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function renderScoreboard() {
            const scoreboard = document.getElementById('teamsScoreboard');
            scoreboard.innerHTML = '';

            for (let i = 1; i <= gameSettings.teams; i++) {
                const teamBox = document.createElement('div');
                teamBox.className = 'team-box';
                if (i === currentTeam) {
                    teamBox.classList.add('active-turn');
                }

                teamBox.innerHTML = `
                    <div class="team-name">Team ${i}</div>
                    <div class="team-score">${teamScores[i] || 0}</div>
                `;
                scoreboard.appendChild(teamBox);
            }
        }
    </script>

</body>
</html>
